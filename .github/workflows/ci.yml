name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out contextql-server
        uses: actions/checkout@v4

      - name: Determine matching contextql engine branch
        id: engine
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --exit-code --heads \
            https://github.com/contextql-lang/contextql.git "$BRANCH" >/dev/null 2>&1; then
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out contextql engine (${{ steps.engine.outputs.branch }})
        uses: actions/checkout@v4
        with:
          repository: contextql-lang/contextql
          ref: ${{ steps.engine.outputs.branch }}
          path: .engine

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install engine and server
        run: |
          python -m pip install --upgrade pip
          pip install -e "./.engine[executor]"
          pip install -e ".[dev]"

      - name: Run server tests
        run: pytest tests/ -v
